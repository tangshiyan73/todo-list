<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>To-Do List</h1>

    <!--
      Single form used for BOTH adding and editing a task.
      Reusing one form (instead of a separate edit modal/form) keeps the UI
      simple and avoids duplicating validation logic in two places.
      The hidden #editingId field is the switch: empty = "add mode",
      populated with a task's id = "edit mode". script.js checks this
      field on submit to decide whether to push a new task or update one.
    -->
    <form id="taskForm">
      <input type="hidden" id="editingId" value="">
      <input type="text" id="title" placeholder="Task title" required>
      <textarea id="description" placeholder="Task description"></textarea>
      <select id="priority">
        <option value="high">High</option>
        <option value="medium" selected>Medium</option>
        <option value="low">Low</option>
      </select>
      <button type="submit" id="submitBtn">Add Task</button>
      <!-- Only shown while editing, so a user can back out of an edit without saving -->
      <button type="button" id="cancelBtn" class="hidden">Cancel</button>
    </form>

    <!-- data-filter values match the filter logic in script.js's render() function -->
    <div class="filters">
      <button class="filterBtn active" data-filter="all">All</button>
      <button class="filterBtn" data-filter="pending">Pending</button>
      <button class="filterBtn" data-filter="complete">Complete</button>
    </div>

    <!-- Populated entirely by JS — intentionally left empty here since
         the task list is dynamic, sourced from localStorage -->
    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
